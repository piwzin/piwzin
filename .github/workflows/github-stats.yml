name: Update stats cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dev stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: show_icons=true&include_all_commits=true&count_private=true&custom_title=Dev%20Stats&border_color=30363d&border_radius=0&bg_color=0d1117&title_color=39d353&text_color=c9d1d9&icon_color=a78bfa
          path: profile/stats.svg
          token: ${{ secrets.PAT }}

      - name: Inventory card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: layout=compact&langs_count=6&card_width=320&custom_title=Inventory&border_color=30363d&border_radius=0&bg_color=0d1117&title_color=39d353&text_color=c9d1d9
          path: profile/top-langs.svg
          token: ${{ secrets.PAT }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update stats cards" || exit 0
          git push
